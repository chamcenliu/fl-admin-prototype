name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Restore latest prototype build
        run: |
          mkdir -p dist
          cat .github/page-dist/dist.zip.b64.* > /tmp/fl-admin-prototype-dist.zip.b64
          base64 -d /tmp/fl-admin-prototype-dist.zip.b64 > /tmp/fl-admin-prototype-dist.zip
          unzip -q /tmp/fl-admin-prototype-dist.zip -d dist
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
